name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  PA_BUILD_NUMBER: ${{ github.run_number }}
permissions:
  contents: read
concurrency:
  group: pa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '14742923'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Tests, lint and debug APK
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            core/build/test-results/
            app/build/reports/
            app/build/outputs/apk/debug/*.apk
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      PA_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
      PA_KEYSTORE_BASE64: ${{ secrets.PA_KEYSTORE_BASE64 }}
      PA_STORE_PASSWORD: ${{ secrets.PA_STORE_PASSWORD }}
      PA_KEY_ALIAS: ${{ secrets.PA_KEY_ALIAS }}
      PA_KEY_PASSWORD: ${{ secrets.PA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '14742923'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Prepare signing and version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          for key in PA_KEYSTORE_BASE64 PA_STORE_PASSWORD PA_KEY_ALIAS PA_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then echo "::error::Missing repository secret $key"; exit 1; fi
          done
          printf '%s' "$PA_KEYSTORE_BASE64" | base64 --decode > "$PA_KEYSTORE_PATH"
          chmod 600 "$PA_KEYSTORE_PATH"
          name=$(sed -n 's/^versionName=//p' version.properties)
          code="$PA_BUILD_NUMBER"
          [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$code" =~ ^[1-9][0-9]*$ ]]
          echo "tag=v${name}+${code}" >> "$GITHUB_OUTPUT"
      - name: Build signed release
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify signature and embedded version
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk > /tmp/badging
          python3 scripts/check_apk_version.py /tmp/badging "$RELEASE_TAG"
      - name: Publish versioned APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "PA-${TAG}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = "$GITHUB_SHA" || { echo 'Existing release tag belongs to a different commit'; exit 1; }
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "P.A. $TAG" --notes 'Sideload APK. See README for permission setup and verification status.'
          fi
          gh release upload "$TAG" "PA-${TAG}.apk" --clobber
      - name: Remove signing material
        if: always()
        run: rm -f "$PA_KEYSTORE_PATH"
